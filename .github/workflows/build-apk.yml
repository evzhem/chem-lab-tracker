name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web (Capacitor base)
        run: npm run build:apk-web
        env:
          CAPACITOR: '1'

      - name: Add Android platform if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/ChemLabTracker.apk
          ls -lh artifacts/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChemLabTracker-apk
          path: artifacts/ChemLabTracker.apk
          retention-days: 90

      - name: Publish / update APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'apk-latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest APK (Android)' }}
          files: artifacts/ChemLabTracker.apk
          generate_release_notes: ${{ startsWith(github.ref, 'refs/tags/') }}
          body: |
            ## ChemLab Tracker для Android

            1. Скачайте **ChemLabTracker.apk** ниже
            2. На телефоне: Настройки → разрешить установку из неизвестных источников
            3. Откройте файл и установите

            **Всё бесплатно** — таблица Менделеева, растворимость, реакции, молярная масса, дневник.

            Сайт / PWA: https://evzhem.github.io/chem-lab-tracker/#/install
